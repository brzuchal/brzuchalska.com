<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Biuro Rachunkowe Magdalena Brzuchalska</title>
  <desc id="desc">Logo biura rachunkowego z ikoną kalkulatora oraz nazwą firmy.</desc>
  <rect width="1200" height="260" fill="#000000"/>

  <g stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(35,32)">
    <rect x="0" y="0" width="112" height="170" rx="12"/>
    <rect x="16" y="18" width="80" height="26" rx="6"/>
    <rect x="16" y="58" width="20" height="20" rx="5"/>
    <rect x="46" y="58" width="20" height="20" rx="5"/>
    <rect x="76" y="58" width="20" height="20" rx="5"/>
    <rect x="16" y="88" width="20" height="20" rx="5"/>
    <rect x="46" y="88" width="20" height="20" rx="5"/>
    <rect x="76" y="88" width="20" height="20" rx="5"/>
    <circle cx="102" cy="140" r="30" fill="#000000"/>
    <line x1="90" y1="152" x2="116" y2="128"/>
    <circle cx="94" cy="136" r="2" fill="#ffffff"/>
    <circle cx="112" cy="148" r="2" fill="#ffffff"/>
  </g>

